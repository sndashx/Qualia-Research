run_dir: results/baseline

model:
  encoder:
    backbone: convnext_tiny
    out_dim: 128
  decoder:
    backbone: convnext_tiny
  workspace_dim: 32
  payload_slots: 16

data:
  name: stochastic_colored_shapes
  batch_size: 16
  num_workers: 0

train:
  steps: 100
  log_every: 10
  lr: 3.0e-4

eval:
  report_consistency_threshold: 0.5
  introspection_accuracy_threshold: 0.0
  workspace_dim: 8
  self_model_dim: 8
  payload_slots: 4
  slot_dim: 6
  attention_schema_dim: 8
  epochs: 80
  lr: 0.1
  dataset:
    num_samples: 32
    percept_dim: 16
    include_agency: true