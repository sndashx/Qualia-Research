run_dir: results/baseline

model:
  encoder:
    backbone: convnext_tiny
    out_dim: 128
  decoder:
    backbone: convnext_tiny
  workspace_dim: 32
  payload_slots: 16

data:
  name: stochastic_colored_shapes
  n_samples: 256
  image_size: 32
  batch_size: 16
  num_workers: 0
  shuffle: true
  rebuild_cache: false
  preprocessing: {}

train:
  steps: 100
  log_every: 10
  lr: 3.0e-4

eval:
  report_consistency_threshold: 0.5
  introspection_accuracy_threshold: 0.5

tracker:
  name: tensorboard
  run_subdir: true