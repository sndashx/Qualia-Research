# @package _global_

defaults:
  - _self_
  - baseline

workspace_dim: 32
payload_slots: 16
seed: 0

model:
  encoder:
    backbone: convnext_tiny
    out_dim: 128
  decoder:
    backbone: convnext_tiny
  workspace_dim: ${workspace_dim}
  payload_slots: ${payload_slots}

train:
  steps: 100
  log_every: 10
  lr: 3.0e-4

eval:
  report_consistency_threshold: 0.5
  introspection_accuracy_threshold: 0.5

tracker:
  name: tensorboard
  run_subdir: true