[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualia"
version = "0.1.0"
description = "Qualia-Research: a neural architecture for coded, introspectable, structured internal states."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qualia-Research Contributors" }]
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "black==24.4.2",
    "pre-commit==3.7.1",
    "tensorboard==2.16.2",
]
tracking = [
    "tensorboard==2.16.2",
    "wandb>=0.17.0",
    "psutil==5.9.8",
]

[project.scripts]
qualia-train = "qualia.train.train:main"
qualia-eval = "qualia.eval.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]